name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skill metadata and markdown links
        run: python -B scripts/validate_repo.py

      - name: Validate fixtures submodule (benchmark_core)
        run: python -B benchmark/synthetics/scripts/validate.py --core-only
